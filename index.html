<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.T.C.E Computer Education | Premium Digital Training Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-serif-luxury { font-family: 'Playfair Display', serif; }

        ::-webkit-scrollbar { width: 8px; background: #020617; }
        ::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.6); }
        
        .bento-card { 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            border: 1px solid rgba(56, 189, 248, 0.15); 
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
        }
        
        .bento-card:hover { 
            transform: translateY(-6px) scale(1.015); 
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 20px 40px -15px rgba(14, 165, 233, 0.3); 
        }

        .pulse-cyan { animation: subtle-pulse 3s ease-in-out infinite; }

        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 25s linear infinite;
        }
        .animate-marquee:hover { animation-play-state: paused; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBLKFYy0u3xbluV0qLKumOE_5lcpplH8T0",
            authDomain: "ntce-2985c.firebaseapp.com",
            projectId: "ntce-2985c",
            storageBucket: "ntce-2985c.firebasestorage.app",
            messagingSenderId: "223968345178",
            appId: "1:223968345178:web:620eb312f606cc584cec63"
        };

        const siteAppId = typeof __app_id !== 'undefined' ? __app_id : "ntce-computer-education-live";
        const googleReviewLink = "https://local.google.com/place?placeid=ChIJu8FW-kRR4DsRNgiy9UB6mEY&utm_medium=noren&utm_source=gbp&utm_campaign=2025";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); // Storage initialized for direct uploads

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('portfolio'); 
            const [adminTab, setAdminTab] = useState('leads'); 
            const [user, setUser] = useState(null);
            
            const [passInput, setPassInput] = useState('');
            const [error, setError] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            
            // Admissions Form State
            const [showAdmissionForm, setShowAdmissionForm] = useState(false);
            const [admissions, setAdmissions] = useState([]);
            const [formData, setFormData] = useState({ name: '', fatherName: '', phone: '', dob: '', school: '', qualification: '', address: '', course: '', reference: '' });

            const [links, setLinks] = useState({
                instagram: "https://www.instagram.com/ntce_1/",
                telegram: "https://t.me/ntce_1",
                google_rate: googleReviewLink,
                whatsapp_channel: "https://whatsapp.com/channel/0029Va4FS8o05MUjU35Eaf3S",
                whatsapp_community: "https://chat.whatsapp.com/GPmLqYA7NK9HF44SfDL6BN",
                facebook: "https://www.facebook.com/NTCECOMPUTER",
                whatsapp: "https://wa.me/919016885151", 
                alertMessage: "🚀 Admissions Open for 2026 batches! Learn Web Development, Tally Prime with GST & Graphic Design with Practical Lab Training. 🚀"
            });

            const [catalog, setCatalog] = useState([
                { id: "c1", title: "Advanced Full-Stack Web Development", category: "Coding", duration: "6 Months", modules: "HTML5, Tailwind CSS, ReactJS, Node.js, Express, MongoDB, Live Projects", img: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=800", desc: "Master industry-ready technologies to become a professional software developer.", isBestSeller: true },
                { id: "c2", title: "Financial Accounting & Tally Prime", category: "Tally", duration: "3 Months", modules: "Company Creation, Ledger Posting, GST Calculation, Payroll Systems, Final Accounts", img: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=800", desc: "Master balance sheets, dynamic taxation, GST calculations, and standard bookkeeping.", isBestSeller: true },
                { id: "c3", title: "Creative Graphic Designing Masterclass", category: "Designing", duration: "4 Months", modules: "Adobe Photoshop, Adobe Illustrator, CorelDraw, Layout Theory, Social Media Kits", img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=800", desc: "Unleash your visual talent with professional instruction in designing tools.", isBestSeller: false },
                { id: "c4", title: "Computer Basics & Office Automation (CCC)", category: "Office", duration: "2 Months", modules: "Windows OS, MS Word Formatting, Excel Spreadsheets, PowerPoint Presentations, Internet", img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=800", desc: "Core computational skills essential for all professional jobs.", isBestSeller: false },
                { id: "c5", title: "Python Programming & Data Analytics", category: "Coding", duration: "6 Months", modules: "Python Syntax, OOP, Pandas, Numpy, Matplotlib, SQL Integrations", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&q=80&w=800", desc: "Learn core Python programming and data visualization libraries.", isBestSeller: true },
                { id: "c6", title: "Advanced MS Excel Mastery", category: "Office", duration: "2 Months", modules: "Pivot Tables, VLOOKUP, HLOOKUP, Power Query, Macros, Dashboards", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=800", desc: "Master complex Formulas and interactive business dashboards for corporate roles.", isBestSeller: false },
                { id: "c7", title: "Digital UI/UX Designing", category: "Designing", duration: "3 Months", modules: "Figma, Wireframing, High-Fidelity Prototyping, User Research, App Layouts", img: "https://images.unsplash.com/photo-1561070791-26c113006238?auto=format&fit=crop&q=80&w=800", desc: "Design user-centric web and mobile products using modern methodologies.", isBestSeller: false },
                { id: "c8", title: "Hardware & Systems Networking", category: "Networking", duration: "6 Months", modules: "PC Assembly, OS Installation, LAN/WAN Topologies, Router Config, Troubleshooting", img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&q=80&w=800", desc: "Learn system assembly, networking configurations, and IT support essentials.", isBestSeller: false },
                { id: "c9", title: "Desktop Publishing (DTP)", category: "Designing", duration: "3 Months", modules: "PageMaker, CorelDraw, Photoshop Basic, Typography, Print Layouts", img: "https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?auto=format&fit=crop&q=80&w=800", desc: "Professional training for print media, magazines, brochures, and layout publishing.", isBestSeller: false },
                { id: "c10", title: "Computerized Embroidery Designing", category: "Designing", duration: "2 Months", modules: "Wilcom Basics, Digitizing Designs, Stitch Types, Machine Connectivity, Textile Patterns", img: "https://images.unsplash.com/photo-1620619767323-b95a89183081?auto=format&fit=crop&q=80&w=800", desc: "Learn to create and digitize beautiful embroidery patterns using specialized software.", isBestSeller: true }
            ]);

            const [gallery, setGallery] = useState([
                { id: "g1", url: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=800", caption: "Advanced Coding Lab" },
                { id: "g2", url: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&q=80&w=800", caption: "Hardware Training" },
                { id: "g3", url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=800", caption: "Student Collaboration" }
            ]);

            const [notes, setNotes] = useState([
                { id: "n1", title: "HTML & CSS Fundamentals", desc: "Core concepts of web structuring and styling for beginners.", link: "#" },
                { id: "n2", title: "Tally Prime Shortcuts", desc: "A cheat sheet of all essential Tally Prime keyboard shortcuts for fast accounting.", link: "#" }
            ]);

            const [testimonials, setTestimonials] = useState([
                { id: "1", name: "Rahul Patel", rating: 5, comment: "Enrolled in Full Stack Web Dev. Excellent and patient faculty. I cleared my interview last month and got hired!" },
                { id: "2", name: "Krina Shah", rating: 5, comment: "Learnt Tally Prime & GST accounting basics here. The class environment is very structured and practice labs are superb." }
            ]);

            const [selectedCategory, setSelectedCategory] = useState("All");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [newReview, setNewReview] = useState({ name: '', comment: '', rating: 5 });

            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // DIRECT UPLOAD TO FIREBASE STORAGE
            const handleFileUpload = async (e, folder, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                triggerToast(`Uploading ${file.name}... Please wait.`);
                
                try {
                    const fileRef = ref(storage, `${folder}/${Date.now()}_${file.name}`);
                    await uploadBytes(fileRef, file);
                    const downloadURL = await getDownloadURL(fileRef);
                    callback(downloadURL);
                    triggerToast(`✅ Upload successful!`);
                } catch (err) {
                    console.error("Upload Error:", err);
                    triggerToast("❌ Upload failed. Please check Firebase Storage rules.");
                } finally {
                    setIsUploading(false);
                }
            };

            // AUTO-CONVERT GOOGLE DRIVE LINKS FOR PDFS/IMAGES
            const formatLink = (url) => {
                if (url.includes('drive.google.com/file/d/')) {
                    const id = url.split('/file/d/')[1].split('/')[0];
                    return `https://drive.google.com/uc?export=download&id=${id}`;
                }
                return url;
            };

            const categoryPlaceholders = {
                "Coding": "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=600",
                "Office": "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600",
                "Designing": "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=600",
                "Networking": "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&q=80&w=600",
                "Tally": "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=600",
                "Other": "https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&q=80&w=600"
            };

            useEffect(() => {
                const initAuthAndFirestore = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.log("Using local interactive sandbox mode.", e);
                    }
                };

                initAuthAndFirestore();
                const unsubscribeAuth = onAuthStateChanged(auth, setUser);
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubSettings = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'settings'), snap => {
                    if (snap.exists()) setLinks(prev => ({ ...prev, ...snap.data(), google_rate: googleReviewLink }));
                }, err => console.log("Config fallback used:", err));

                const unsubCatalog = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'catalog', 'products'), snap => {
                    if (snap.exists() && snap.data().items) setCatalog(snap.data().items);
                }, err => console.log("Catalog fallback used:", err));

                const unsubGallery = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'gallery'), snap => {
                    if (snap.exists() && snap.data().photos) setGallery(snap.data().photos);
                }, err => console.log("Gallery fallback used:", err));

                const unsubNotes = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'education', 'notes'), snap => {
                    if (snap.exists() && snap.data().list) setNotes(snap.data().list);
                }, err => console.log("Notes fallback used:", err));

                const unsubTest = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'feedback', 'userReviews'), snap => {
                    if (snap.exists() && snap.data().list) setTestimonials(snap.data().list);
                }, err => console.log("Testimonials fallback used:", err));

                const unsubAdmissions = onSnapshot(doc(db, 'artifacts', siteAppId, 'public', 'data', 'admissions', 'leads'), snap => {
                    if (snap.exists() && snap.data().list) setAdmissions(snap.data().list);
                }, err => console.log("Admissions fallback used:", err));

                return () => { unsubSettings(); unsubCatalog(); unsubGallery(); unsubNotes(); unsubTest(); unsubAdmissions(); };
            }, [user]);

            const handleSaveSettings = async () => {
                if (!user) return triggerToast("Not authorized yet!");
                setIsSaving(true);
                try {
                    await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'settings'), links, { merge: true });
                    triggerToast("✨ Settings saved to Cloud!");
                } catch (err) { triggerToast("Saved locally."); } finally { setIsSaving(false); }
            };

            const handleSaveCatalog = async (updated) => { setCatalog(updated); if(user) setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'catalog', 'products'), { items: updated }).catch(e=>console.log(e)); };
            const handleSaveGallery = async (updated) => { setGallery(updated); if(user) setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'gallery'), { photos: updated }).catch(e=>console.log(e)); };
            const handleSaveNotes = async (updated) => { setNotes(updated); if(user) setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'education', 'notes'), { list: updated }).catch(e=>console.log(e)); };
            const handleSaveTestimonials = async (updated) => { setTestimonials(updated); if(user) setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'feedback', 'userReviews'), { list: updated }).catch(e=>console.log(e)); };
            const handleSaveAdmissions = async (updated) => { setAdmissions(updated); if(user) setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'admissions', 'leads'), { list: updated }).catch(e=>console.log(e)); };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passInput === 'Tamnna@123') { setView('admin'); setError(''); triggerToast("Logged in as Administrator 👑"); } 
                else { setError('Incorrect Password'); }
            };

            // SILENT ADMISSION SUBMIT 
            const handleAdmissionSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.phone || !formData.course) {
                    return triggerToast("Name, Phone, and Course are required fields.");
                }
                const newAdmission = { ...formData, id: Date.now().toString(), date: new Date().toLocaleString() };
                handleSaveAdmissions([newAdmission, ...admissions]);
                
                triggerToast("🎉 Application Submitted Successfully! We will contact you soon.");
                setShowAdmissionForm(false);
                setFormData({ name: '', fatherName: '', phone: '', dob: '', school: '', qualification: '', address: '', course: '', reference: '' });
            };

            const submitReview = (e) => {
                e.preventDefault();
                if (!newReview.name.trim() || !newReview.comment.trim()) return triggerToast("Fill name and feedback!");
                handleSaveTestimonials([{ id: Date.now().toString(), ...newReview, rating: parseInt(newReview.rating) || 5 }, ...testimonials]);
                setNewReview({ name: '', comment: '', rating: 5 }); triggerToast("💻 Thank you for your review!");
            };

            const [newItem, setNewItem] = useState({ title: '', category: 'Coding', duration: '', modules: '', desc: '', img: '', isBestSeller: false });
            const addNewProduct = () => {
                if (!newItem.title || !newItem.duration) return triggerToast("Course Title and Duration required.");
                handleSaveCatalog([{ ...newItem, id: Date.now().toString(), img: newItem.img.trim() || categoryPlaceholders[newItem.category] }, ...catalog]);
                setNewItem({ title: '', category: 'Coding', duration: '', modules: '', desc: '', img: '', isBestSeller: false }); triggerToast("📦 Course added!");
            };

            const [newPhoto, setNewPhoto] = useState({ url: '', caption: '' });
            const addPhoto = () => {
                if (!newPhoto.url) return triggerToast("Image URL is required");
                handleSaveGallery([{ id: Date.now().toString(), ...newPhoto }, ...gallery]);
                setNewPhoto({ url: '', caption: '' }); triggerToast("📸 Photo added!");
            };

            const [newNote, setNewNote] = useState({ title: '', desc: '', link: '' });
            const addNote = () => {
                if (!newNote.title || !newNote.link) return triggerToast("Title and PDF Link are required");
                handleSaveNotes([{ id: Date.now().toString(), ...newNote }, ...notes]);
                setNewNote({ title: '', desc: '', link: '' }); triggerToast("📚 Material added!");
            };

            const filteredCatalog = useMemo(() => {
                if (selectedCategory === "All") return catalog;
                return catalog.filter(item => item.category === selectedCategory);
            }, [catalog, selectedCategory]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950 relative">
                    
                    {/* Floating Nav Bar */}
                    {view === 'portfolio' && (
                        <nav className="fixed top-0 w-full z-40 bg-[#0f172a]/90 backdrop-blur-xl border-b border-cyan-500/10">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[72px] flex items-center justify-between">
                                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => window.scrollTo(0,0)}>
                                    <div className="h-12 w-12 bg-white rounded-full flex items-center justify-center p-0.5 overflow-hidden shadow-[0_0_15px_rgba(34,211,238,0.3)] group-hover:shadow-[0_0_20px_rgba(34,211,238,0.6)] transition-all">
                                        <img src="NTCE.png" alt="NTCE Logo" className="h-full w-full object-cover" />
                                    </div>
                                    <div className="text-xs sm:text-[15px] uppercase font-extrabold tracking-[0.2em] text-cyan-400 font-serif-luxury hidden sm:block leading-tight">
                                        N.T.C.E<br/><span className="text-[9px] text-slate-400 tracking-[0.3em]">Education</span>
                                    </div>
                                </div>
                                <div className="flex gap-4 sm:gap-7 items-center text-[11px] sm:text-xs font-bold uppercase tracking-[0.15em] text-slate-300">
                                    <a href="#home" className="hover:text-cyan-400 transition-colors">Home</a>
                                    <a href="#courses" className="hover:text-cyan-400 transition-colors">Courses</a>
                                    <a href="#materials" className="hover:text-cyan-400 transition-colors text-emerald-400">Notes</a>
                                    <a href="#gallery" className="hover:text-cyan-400 transition-colors hidden md:block">Gallery</a>
                                    <button onClick={() => setView('login')} className="ml-2 bg-white/5 border border-white/10 p-2 rounded-full hover:bg-cyan-500 hover:text-slate-900 transition-all" title="Admin Login">
                                        <svg viewBox="0 0 24 24" fill="currentColor" className="w-4 h-4"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </nav>
                    )}

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black py-4 px-6 rounded-3xl shadow-2xl flex items-center justify-between">
                            <span className="text-sm tracking-wide">{toastMessage}</span>
                            <button onClick={() => setToastMessage(null)} className="ml-3 text-lg font-black">&times;</button>
                        </div>
                    )}

                    {/* MAIN PORTFOLIO VIEW */}
                    {view === 'portfolio' && (
                        <div className="flex-grow pt-[104px] pb-12">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-20">
                                
                                {/* 1. Hero & Bento Section */}
                                <section id="home">
                                    <div className="text-center mb-12 flex flex-col items-center">
                                        <div className="w-24 h-24 sm:w-28 sm:h-28 bg-white rounded-full flex items-center justify-center p-1 overflow-hidden shadow-2xl shadow-cyan-500/20 mb-6 border border-cyan-500/30 pulse-cyan">
                                            <img src="NTCE.png" alt="NTCE Main Logo" className="h-full w-full object-cover" />
                                        </div>
                                        <span className="inline-block bg-sky-950/80 text-cyan-300 font-extrabold text-[11px] uppercase tracking-[0.3em] px-5 py-2 rounded-full border border-cyan-500/30 mb-6">
                                            Surat's Premier IT Institute
                                        </span>
                                        <h1 className="text-4xl sm:text-6xl md:text-7xl font-black leading-[0.95] tracking-tighter uppercase drop-shadow-lg mb-6">
                                            <span className="text-white text-3xl sm:text-5xl md:text-6xl">COMPUTER</span><br/>
                                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-300 text-5xl sm:text-6xl md:text-7xl">EDUCATION</span>
                                        </h1>
                                        <p className="text-slate-300/80 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed font-light uppercase tracking-widest">
                                            Empowering future Software Developers, System Accountants, and Graphic Designers with ISO Certified Training.
                                        </p>
                                    </div>

                                    {/* Marquee Ticker */}
                                    <div className="relative w-full overflow-hidden bg-gradient-to-r from-slate-950/40 via-sky-950/20 to-slate-950/40 border-y border-cyan-400/20 py-4 mb-10 rounded-2xl max-w-4xl mx-auto">
                                        <div className="animate-marquee whitespace-nowrap text-cyan-300 font-medium text-xs sm:text-sm tracking-widest flex items-center">

                                    <div>
                                        <label className="text-[10px] font-black uppercase tracking-widest text-cyan-400/80 block mb-2">Security Key</label>

                                </form>
                            </div>
                        </div>

                    {/* ==================================== */}
                    {/* VIEW: ADMIN DASHBOARD */}
                    {/* ==================================== */}
                    {view === 'admin' && (
                        <div className="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-8 animate-in pt-12 text-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-white/10 pb-6">
                                <div>
                                    <h1 className="text-3xl font-serif-luxury font-black text-cyan-300">Hub Dashboard</h1>
                                    <p className="text-[10px] uppercase tracking-widest text-cyan-400/80 font-bold mt-1">Real-time Cloud Manager</p>
                                </div>
                                <button onClick={() => setView('portfolio')} className="bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-full text-white text-xs font-bold uppercase tracking-wider">✕ Close to Web</button>
                            </div>

                            <div className="flex flex-wrap gap-2 mb-8">
                                {['leads', 'catalog', 'materials', 'gallery', 'links', 'testimonials'].map(tab => (
                                    <button key={tab} onClick={() => setAdminTab(tab)} className={`px-5 py-2.5 text-xs uppercase font-black tracking-widest rounded-full transition-all ${adminTab === tab ? "bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20" : "bg-white/5 text-cyan-100 hover:bg-white/10"}`}>
                                        {tab === 'leads' ? 'Forms & Leads' : tab === 'catalog' ? 'Courses' : tab === 'materials' ? 'Study Materials' : tab === 'gallery' ? 'Gallery' : tab === 'links' ? 'Settings' : 'Reviews'}
                                    </button>
                                ))}
                            </div>

                            {}
                            {/* TAB: FORMS & LEADS (NEW ADMISSIONS) */}
                            {adminTab === 'leads' && (
                                <div className="space-y-4">
                                    <h3 className="text-sm font-black uppercase tracking-wider text-cyan-400 mb-6">Student Admission Applications ({admissions.length})</h3>
                                    {admissions.length === 0 ? (
                                        <div className="text-center py-12 bg-white/5 rounded-3xl border border-white/5"><p className="text-cyan-100/50 text-xs uppercase font-bold">No forms submitted yet.</p></div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                            {admissions.map(lead => (
                                                <div key={lead.id} className="bg-slate-900/50 p-5 rounded-[24px] border border-cyan-500/20 flex flex-col justify-between">
                                                    <div>
                                                        <div className="flex justify-between items-start border-b border-white/10 pb-3 mb-3">
                                                            <div>
                                                                <h4 className="text-lg font-bold text-white leading-tight">{lead.name}</h4>
                                                                <p className="text-[10px] text-cyan-400 uppercase tracking-widest mt-1">{lead.course}</p>
                                                            </div>
                                                            <span className="text-[9px] text-slate-500 font-bold">{lead.date.split(',')[0]}</span>
                                                        </div>
                                                        <div className="space-y-1.5 mb-4">
                                                            <p className="text-xs text-slate-300"><span className="text-white/40 uppercase text-[9px] tracking-widest inline-block w-16">Phone:</span> {lead.phone}</p>
                                                            {lead.qualification && <p className="text-xs text-slate-300"><span className="text-white/40 uppercase text-[9px] tracking-widest inline-block w-16">Edu:</span> {lead.qualification}</p>}
                                                            {lead.school && <p className="text-xs text-slate-300"><span className="text-white/40 uppercase text-[9px] tracking-widest inline-block w-16">School:</span> {lead.school}</p>}
                                                            {lead.address && <p className="text-xs text-slate-300"><span className="text-white/40 uppercase text-[9px] tracking-widest inline-block w-16">Address:</span> {lead.address}</p>}
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2 border-t border-white/5 pt-4">
                                                        <a href={`https://wa.me/91${lead.phone.replace(/\D/g,'')}?text=Hello%20${lead.name},%20we%20received%20your%20admission%20inquiry%20for%20${lead.course}%20at%20NTCE.`} target="_blank" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px] py-2.5 rounded-lg uppercase tracking-wider text-center transition-colors">Chat on WA</a>
                                                        <button onClick={() => { handleSaveAdmissions(admissions.filter(a => a.id !== lead.id)); triggerToast("Lead deleted."); }} className="bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white px-4 py-2.5 rounded-lg transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {adminTab === 'catalog' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900/50 p-6 rounded-[32px] border border-cyan-500/20 h-fit">
                                        <h3 className="text-sm font-black uppercase tracking-wider text-cyan-400 mb-6">Add New Training Program</h3>
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Course Title</label><input type="text" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.title} onChange={(e) => setNewItem({...newItem, title: e.target.value})} /></div>
                                                <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Duration</label><input type="text" placeholder="e.g. 6 Months" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.duration} onChange={(e) => setNewItem({...newItem, duration: e.target.value})} /></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Domain</label><select className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.category} onChange={(e) => setNewItem({...newItem, category: e.target.value})}><option value="Coding">Coding</option><option value="Tally">Tally</option><option value="Designing">Designing</option><option value="Office">Office</option><option value="Networking">Networking</option></select></div>
                                                <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Badge</label><select className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.isBestSeller ? "true" : "false"} onChange={(e) => setNewItem({...newItem, isBestSeller: e.target.value === "true"})}><option value="false">Standard</option><option value="true">Best Choice</option></select></div>
                                            </div>
                                            
                                            <div className="mb-3 p-4 bg-white/5 rounded-xl border border-white/10 border-dashed">
                                                <label className="text-[10px] uppercase font-bold text-cyan-400 block mb-2">1. Direct Upload (From Device)</label>
                                                <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'courses', (url) => setNewItem({...newItem, img: url}))} className="w-full text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/30 mb-3" />
                                                
                                                <div className="flex items-center gap-2 mb-2">
                                                    <div className="h-px bg-white/10 flex-grow"></div><span className="text-white/30 text-[9px] uppercase tracking-widest font-bold">OR</span><div className="h-px bg-white/10 flex-grow"></div>
                                                </div>

                                                <label className="text-[10px] uppercase font-bold text-cyan-400 block mb-2">2. Indirect Link (Paste Image URL)</label>
                                                <input type="text" placeholder="https://images.unsplash.com/..." className="w-full bg-slate-950 text-white rounded-lg p-2.5 text-xs outline-none border border-white/10 focus:border-cyan-400" value={newItem.img} onChange={(e) => setNewItem({...newItem, img: e.target.value})} />
                                            </div>

                                            <div>
                                                <label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Key Modules / Syllabus (Comma Separated)</label>
                                                <input type="text" placeholder="HTML, CSS, React, Node..." className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.modules} onChange={(e) => setNewItem({...newItem, modules: e.target.value})} />
                                            </div>
                                            <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Description</label><textarea rows="3" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newItem.desc} onChange={(e) => setNewItem({...newItem, desc: e.target.value})}></textarea></div>
                                            <button onClick={addNewProduct} disabled={isUploading} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all shadow-lg disabled:opacity-50">
                                                {isUploading ? "Uploading file..." : "Publish Course"}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-black uppercase tracking-wider text-cyan-300 px-2">Active Courses ({catalog.length})</h3>

                                            {catalog.map(item => (
                                                <div key={item.id} className="p-4 bg-white/5 rounded-2xl border border-white/10 flex items-center justify-between gap-4">
                                                    <div className="flex items-center gap-4">
                                                        <img src={item.img} alt="" className="w-14 h-14 object-cover rounded-xl bg-slate-950" onError={(e) => { e.target.src = categoryPlaceholders[item.category] || categoryPlaceholders["Other"]; }} />
                                                        <div>
                                                            <span className="text-[8px] uppercase font-black px-2 py-0.5 rounded-md bg-cyan-400/20 text-cyan-300 mr-2 border border-cyan-400/20">{item.category}</span>
                                                            <h4 className="text-sm font-bold text-white leading-tight mt-1">{item.title}</h4>
                                                            <p className="text-[10px] text-slate-400 font-bold mt-1">⏱️ {item.duration}</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteProduct(item.id)} className="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl transition-all" title="Delete"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {adminTab === 'materials' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">

                                        <div className="space-y-4">
                                            <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Material Title</label><input type="text" placeholder="e.g. Tally Prime Shortcut Keys" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-emerald-400" value={newNote.title} onChange={(e) => setNewNote({...newNote, title: e.target.value})} /></div>
                                            
                                            <div className="p-4 bg-white/5 rounded-xl border border-white/10 border-dashed">
                                                <label className="text-[10px] uppercase font-bold text-emerald-400 block mb-2">1. Direct Upload (From Device)</label>
                                                <input type="file" accept="application/pdf" onChange={(e) => handleFileUpload(e, 'pdfs', (url) => setNewNote({...newNote, link: url}))} className="w-full text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-emerald-500/20 file:text-emerald-300 hover:file:bg-emerald-500/30 mb-3" />
                                                
                                                <div className="flex items-center gap-2 mb-2">
                                                    <div className="h-px bg-white/10 flex-grow"></div><span className="text-white/30 text-[9px] uppercase tracking-widest font-bold">OR</span><div className="h-px bg-white/10 flex-grow"></div>
                                                </div>

                                                <label className="text-[10px] uppercase font-bold text-emerald-400 block mb-2">2. Indirect Link (Paste Drive URL)</label>

                                            </div>

                                            <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Short Description</label><textarea rows="2" placeholder="Describe the topics covered in this PDF..." className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-emerald-400" value={newNote.desc} onChange={(e) => setNewNote({...newNote, desc: e.target.value})}></textarea></div>
                                            <button onClick={addNote} disabled={isUploading} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all shadow-lg disabled:opacity-50">
                                                {isUploading ? "Uploading File..." : "Publish Notes"}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-black uppercase tracking-wider text-emerald-300 px-2">Live Materials ({notes.length})</h3>
                                        <div className="max-h-[600px] overflow-y-auto pr-2 space-y-3 scrollbar-none">
                                            {notes.map(note => (
                                                <div key={note.id} className="p-5 bg-white/5 rounded-2xl border border-white/10 flex items-center justify-between gap-4">
                                                    <div>
                                                        <h4 className="text-sm font-bold text-white leading-tight">{note.title}</h4>
                                                        <p className="text-[10px] text-slate-400 mt-1 line-clamp-1">{note.desc}</p>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <a href={note.link} target="_blank" className="p-2 bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-900 rounded-xl transition-all" title="View PDF"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></a>
                                                        <button onClick={() => {
                                                            const updated = notes.filter(n => n.id !== note.id);
                                                            handleSaveNotes(updated);
                                                            triggerToast("Material deleted.");
                                                        }} className="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl transition-all" title="Delete"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: GALLERY MANAGER */}
                            {adminTab === 'gallery' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900/50 p-6 rounded-[32px] border border-cyan-500/20 h-fit">
                                        <h3 className="text-sm font-black uppercase tracking-wider text-cyan-400 mb-6">Upload to Gallery</h3>
                                        <div className="space-y-4">
                                            
                                            <div className="p-4 bg-white/5 rounded-xl border border-white/10 border-dashed">
                                                <label className="text-[10px] uppercase font-bold text-cyan-400 block mb-2">1. Direct Upload (From Device)</label>
                                                <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'gallery', (url) => setNewPhoto({...newPhoto, url: url}))} className="w-full text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/30 mb-3" />
                                                
                                                <div className="flex items-center gap-2 mb-2">
                                                    <div className="h-px bg-white/10 flex-grow"></div><span className="text-white/30 text-[9px] uppercase tracking-widest font-bold">OR</span><div className="h-px bg-white/10 flex-grow"></div>
                                                </div>

                                                <label className="text-[10px] uppercase font-bold text-cyan-400 block mb-2">2. Indirect Link (Paste Image URL)</label>

                                            </div>

                                            <div><label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Short Caption</label><input type="text" placeholder="e.g. Students in Lab" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={newPhoto.caption} onChange={(e) => setNewPhoto({...newPhoto, caption: e.target.value})} /></div>
                                            <button onClick={addPhoto} disabled={isUploading} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all shadow-lg disabled:opacity-50">
                                                {isUploading ? "Uploading Photo..." : "Add Photo"}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-black uppercase tracking-wider text-cyan-300 px-2">Live Gallery ({gallery.length})</h3>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto pr-2 scrollbar-none">
                                            {gallery.map(item => (
                                                <div key={item.id} className="relative aspect-square rounded-2xl overflow-hidden group border border-white/10">
                                                    <img src={item.url} alt={item.caption} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" />

                                                        const updated = gallery.filter(g => g.id !== item.id);
                                                        handleSaveGallery(updated);
                                                        triggerToast("Photo removed.");
                                                    }} className="absolute top-2 right-2 bg-rose-500/80 hover:bg-rose-600 text-white p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                                                    <div className="absolute bottom-0 w-full bg-slate-950/80 p-2"><p className="text-[9px] font-bold text-cyan-300 truncate text-center">{item.caption}</p></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: SETTINGS & LINKS */}
                            {adminTab === 'links' && (
                                <div className="max-w-2xl">
                                    <div className="bg-white/5 p-6 rounded-[32px] border border-white/10 space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-cyan-300 block mb-2">Announcement Banner Text</label>
                                            <textarea rows="2" className="w-full bg-[#020617] text-white rounded-xl px-4 py-3 text-xs outline-none border border-white/10 focus:border-cyan-400" value={links.alertMessage || ''} onChange={(e) => setLinks({...links, alertMessage: e.target.value})}></textarea>
                                        </div>
                                        {Object.keys(links).filter(k => k !== 'alertMessage').map(key => (
                                            <div key={key}>
                                                <label className="text-[10px] font-black uppercase text-white/60 block mb-1">{key.replace('_', ' ')}</label>
                                                <input className="w-full bg-[#020617] text-white rounded-lg px-4 py-3 text-xs outline-none border border-white/10 focus:border-cyan-400 disabled:opacity-50" value={links[key] || ''} disabled={key === 'google_rate'} onChange={(e) => setLinks({...links, [key]: e.target.value})} />
                                            </div>
                                        ))}
                                        <button onClick={handleSaveSettings} disabled={isSaving} className="w-full bg-cyan-500 text-slate-950 font-black py-4 rounded-xl hover:bg-cyan-400 transition-all text-xs uppercase tracking-widest mt-6">
                                            {isSaving ? "Saving..." : "Save Settings"}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* TAB: TESTIMONIALS */}
                            {adminTab === 'testimonials' && (
                                <div className="max-w-2xl space-y-4">
                                    <h3 className="text-xs font-black uppercase tracking-wider text-cyan-300">Manage Reviews</h3>
                                    {testimonials.map(item => (
                                        <div key={item.id} className="p-5 bg-white/5 rounded-2xl border border-white/10 flex items-start justify-between gap-4">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-sm font-bold text-cyan-200">{item.name}</span>
                                                    <span className="text-[10px] text-cyan-400 font-medium">({item.rating} ★)</span>
                                                </div>
                                                <p className="text-xs text-white/70 italic">"{item.comment}"</p>
                                            </div>
                                            <button onClick={() => { handleSaveTestimonials(testimonials.filter(t => t.id !== item.id)); triggerToast("Review removed."); }} className="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 px-3 py-1.5 rounded-lg font-bold transition-colors">Delete</button>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>
                    )}

                    {/* ==================================== */}
                    {/* CUSTOM FOOTER */}
                    {/* ==================================== */}
                    <footer className="mt-20 text-center space-y-8 pb-12 border-t border-cyan-500/10 pt-12 bg-slate-950 relative z-10">
                        <div className="flex justify-center gap-4 sm:gap-8 text-sm flex-wrap px-4">
                            <a href={links.instagram} target="_blank" className="text-white/40 hover:text-cyan-400 transition-all font-bold uppercase tracking-wider text-[10px]">Instagram</a>
                            <a href={links.telegram} target="_blank" className="text-white/40 hover:text-sky-400 transition-all font-bold uppercase tracking-wider text-[10px]">Telegram</a>
                            <a href={links.facebook} target="_blank" className="text-white/40 hover:text-blue-500 transition-all font-bold uppercase tracking-wider text-[10px]">Facebook</a>
                            <a href={links.google_rate} target="_blank" className="text-white/40 hover:text-cyan-300 transition-all font-bold uppercase tracking-wider text-[10px]">Google Reviews</a>
                            <a href={links.whatsapp} target="_blank" className="text-white/40 hover:text-emerald-400 transition-all font-bold uppercase tracking-wider text-[10px]">Contact Us</a>
                        </div>
                        <div className="space-y-2">
                            <p className="text-[10px] uppercase tracking-[0.4em] text-white/30 font-bold">© 2026 N.T.C.E COMPUTER EDUCATION</p>
                            <p className="text-[8px] uppercase tracking-[0.2em] text-cyan-500/30 font-semibold italic">Shaping Tomorrow's Digital Champions with ISO Certified Excellence</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
