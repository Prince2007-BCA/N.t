<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.T.C.E Computer Education | Premium Digital Training Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-serif-luxury {
            font-family: 'Playfair Display', serif;
        }

        ::-webkit-scrollbar { 
            width: 8px;
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 211, 238, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 211, 238, 0.6);
        }
        
        .bento-card { 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            border: 1px solid rgba(56, 189, 248, 0.15); 
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
        }
        
        .bento-card:hover { 
            transform: translateY(-6px) scale(1.015); 
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 20px 40px -15px rgba(14, 165, 233, 0.3); 
        }

        .pulse-cyan {
            animation: subtle-pulse 3s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 25s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDYxhq1itKAuE0Gtk7k2irVXRDOGEKqSJc",
            authDomain: "tamnnadupattahub-3255c.firebaseapp.com",
            projectId: "tamnnadupattahub-3255c",
            storageBucket: "tamnnadupattahub-3255c.firebasestorage.app",
            messagingSenderId: "976366593432",
            appId: "1:976366593432:web:bec3655409f620b01ab7ed",
            measurementId: "G-5KRYTFNLSV"
        };

        const siteAppId = typeof __app_id !== 'undefined' ? __app_id : "ntce-computer-education-live";
        const googleReviewLink = "https://local.google.com/place?placeid=ChIJu8FW-kRR4DsRNgiy9UB6mEY&utm_medium=noren&utm_source=gbp&utm_campaign=2025";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); 

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('portfolio'); 
            const [adminTab, setAdminTab] = useState('catalog'); 
            const [user, setUser] = useState(null);
            
            const [passInput, setPassInput] = useState('');
            const [error, setError] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            
            const [links, setLinks] = useState({
                instagram: "https://www.instagram.com/ntce_1/",
                telegram: "https://t.me/ntce_1",
                google_rate: googleReviewLink,
                whatsapp_channel: "https://whatsapp.com/channel/0029Va4FS8o05MUjU35Eaf3S",
                facebook: "https://www.facebook.com/NTCECOMPUTER",
                student_portal: "https://wa.me/919016885151?text=Hello!%20I%20want%20to%20know%20more%20about%20your%20computer%20batches.",
                best_seller: "https://wa.me/919016885151?text=I%20want%20to%20enroll%20in%20the%20Web%20Development%20program.",
                whatsapp: "https://wa.me/919016885151", 
                alertMessage: "🚀 Admissions Open for 2026 batches! Learn Web Development, Tally Prime with GST & Graphic Design with Practical Lab Training. 🚀"
            });

            // RESTORED ORIGINAL COURSE CATALOG
            const [catalog, setCatalog] = useState([
                {
                    id: "course1",
                    title: "Advanced Full-Stack Web Development",
                    category: "Coding",
                    duration: "6 Months",
                    modules: "HTML5, Tailwind CSS, ReactJS, Node.js, Express, MongoDB, Live Project Deployment",
                    img: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=800",
                    desc: "Master industry-ready technologies. Become a professional software developer capable of building complex web applications.",
                    isBestSeller: true
                },
                {
                    id: "course2",
                    title: "Financial Accounting & Tally Prime",
                    category: "Tally",
                    duration: "3 Months",
                    modules: "Company Creation, Ledger Posting, GST Calculation, Payroll Systems, Final Accounts",
                    img: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=800",
                    desc: "Master balance sheets, dynamic taxation, GST calculations, invoices, and standard business bookkeeping processes.",
                    isBestSeller: true
                },
                {
                    id: "course3",
                    title: "Creative Graphic Designing Masterclass",
                    category: "Designing",
                    duration: "4 Months",
                    modules: "Adobe Photoshop, Adobe Illustrator, CorelDraw, Layout Theory, Social Media Kits",
                    img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=800",
                    desc: "Unleash your visual talent. Detailed professional instruction in industry-standard designing tools.",
                    isBestSeller: false
                },
                {
                    id: "course4",
                    title: "Computer Basics & Office Automation (CCC)",
                    category: "Office",
                    duration: "2 Months",
                    modules: "Windows OS, MS Word Formatting, Excel Spreadsheets, PowerPoint Presentations, Internet",
                    img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=800",
                    desc: "Core computational skills essential for all professional jobs.",
                    isBestSeller: false
                }
            ]);
            
            const [albums, setAlbums] = useState([]);
            const [selectedAlbum, setSelectedAlbum] = useState(null);

            // RESTORED ORIGINAL NOTES
            const [notes, setNotes] = useState([
                { id: "n1", title: "HTML & CSS Core Cheatsheet", category: "Coding", pdfUrl: "#" },
                { id: "n2", title: "Tally Prime Keyboard Shortcuts", category: "Tally", pdfUrl: "#" },
                { id: "n3", title: "Graphic Design Color Theory Guide", category: "Designing", pdfUrl: "#" }
            ]);

            // RESTORED ORIGINAL TESTIMONIALS
            const [testimonials, setTestimonials] = useState([
                { id: "1", name: "Rahul Patel", rating: 5, comment: "Enrolled in Full Stack Web Dev. Excellent and patient faculty. I cleared my interview last month and got hired!" },
                { id: "2", name: "Krina Shah", rating: 5, comment: "Learnt Tally Prime & GST accounting basics here. The class environment is very structured and practice labs are superb." }
            ]);

            const [selectedCategory, setSelectedCategory] = useState("All");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [newReview, setNewReview] = useState({ name: '', comment: '', rating: 5 });

            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const categoryPlaceholders = {
                "Coding": "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=600",
                "Office": "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600",
                "Designing": "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=600",
                "Networking": "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&q=80&w=600",
                "Tally": "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=600",
                "Other": "https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&q=80&w=600"
            };

            useEffect(() => {
                const initAuthAndFirestore = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.log("Using local interactive sandbox mode.", e);
                    }
                };

                initAuthAndFirestore();
                const unsubscribeAuth = onAuthStateChanged(auth, setUser);
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;

                const settingsRef = doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'settings');
                const unsubSettings = onSnapshot(settingsRef, snap => {
                    if (snap.exists()) setLinks(prev => ({ ...prev, ...snap.data(), google_rate: googleReviewLink }));
                });

                const catalogRef = doc(db, 'artifacts', siteAppId, 'public', 'data', 'catalog', 'products');
                const unsubCatalog = onSnapshot(catalogRef, snap => {
                    if (snap.exists() && snap.data().items) setCatalog(snap.data().items);
                });

                const albumsRef = doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'albums');
                const unsubAlbums = onSnapshot(albumsRef, snap => {
                    if (snap.exists() && snap.data().list) setAlbums(snap.data().list);
                });

                const notesRef = doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'notes');
                const unsubNotes = onSnapshot(notesRef, snap => {
                    if (snap.exists() && snap.data().list) setNotes(snap.data().list);
                });

                const testRef = doc(db, 'artifacts', siteAppId, 'public', 'data', 'feedback', 'userReviews');
                const unsubTest = onSnapshot(testRef, snap => {
                    if (snap.exists() && snap.data().list) setTestimonials(snap.data().list);
                });

                return () => { unsubSettings(); unsubCatalog(); unsubAlbums(); unsubNotes(); unsubTest(); };
            }, [user]);

            const handleSaveSettings = async () => {
                if (!user) return triggerToast("Not authorized yet!");
                setIsSaving(true);
                try {
                    await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'settings'), links, { merge: true });
                    triggerToast("✨ Links updated successfully!");
                } catch (err) { triggerToast("Saved locally."); } 
                finally { setIsSaving(false); }
            };

            const handleSaveCatalog = async (updated) => {
                setCatalog(updated);
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'catalog', 'products'), { items: updated }); } 
                catch (err) { console.log(err); }
            };

            const handleSaveAlbums = async (updated) => {
                setAlbums(updated);
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'albums'), { list: updated }); } 
                catch (err) { console.log(err); }
            };

            const handleSaveNotes = async (updated) => {
                setNotes(updated);
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'config', 'notes'), { list: updated }); } 
                catch (err) { console.log(err); }
            };

            const handleSaveTestimonials = async (updated) => {
                setTestimonials(updated);
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', siteAppId, 'public', 'data', 'feedback', 'userReviews'), { list: updated }); } 
                catch (err) { console.log(err); }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passInput === 'Tamnna@123') {
                    setView('admin'); setError(''); triggerToast("Logged in as Administrator 👑");
                } else { setError('Incorrect Security Passphrase'); }
            };

            const submitReview = (e) => {
                e.preventDefault();
                if (!newReview.name.trim() || !newReview.comment.trim()) return triggerToast("Please fill in your name and feedback!");
                const reviewItem = { id: Date.now().toString(), name: newReview.name, comment: newReview.comment, rating: parseInt(newReview.rating) || 5 };
                handleSaveTestimonials([reviewItem, ...testimonials]);
                setNewReview({ name: '', comment: '', rating: 5 });
                triggerToast("💻 Thank you for sharing your educational journey!");
            };

            const [newItem, setNewItem] = useState({ title: '', category: 'Coding', duration: '', modules: '', desc: '', img: '', isBestSeller: false });
            const addNewProduct = () => {
                if (!newItem.title || !newItem.duration) return triggerToast("Course Title and Duration required.");
                const itemToAdd = { ...newItem, id: Date.now().toString(), img: newItem.img.trim() || categoryPlaceholders[newItem.category] };
                handleSaveCatalog([itemToAdd, ...catalog]);
                setNewItem({ title: '', category: 'Coding', duration: '', modules: '', desc: '', img: '', isBestSeller: false });
                triggerToast("📦 Course added!");
            };

            // DIRECT PDF UPLOAD
            const [newNote, setNewNote] = useState({ title: '', category: 'Coding' });
            const [pdfFile, setPdfFile] = useState(null);
            const [isUploadingPdf, setIsUploadingPdf] = useState(false);

            const handleAddNote = async () => {
                if (!newNote.title || !pdfFile) return triggerToast("Title and PDF file are required");
                setIsUploadingPdf(true);
                try {
                    const fileRef = storageRef(storage, `pdfs/${Date.now()}_${pdfFile.name}`);
                    await uploadBytesResumable(fileRef, pdfFile);
                    const url = await getDownloadURL(fileRef);

                    handleSaveNotes([{ id: Date.now().toString(), title: newNote.title, category: newNote.category, pdfUrl: url }, ...notes]);
                    setNewNote({ title: '', category: 'Coding' });
                    setPdfFile(null);
                    document.getElementById('pdf-upload').value = '';
                    triggerToast("📄 Study Material uploaded!");
                } catch (err) {
                    triggerToast("Failed to upload PDF");
                    console.error(err);
                }
                setIsUploadingPdf(false);
            };

            // DIRECT ALBUM / COLLAGE UPLOAD
            const [albumTitle, setAlbumTitle] = useState('');
            const [albumCoverFile, setAlbumCoverFile] = useState(null);
            const [albumFiles, setAlbumFiles] = useState(null);
            const [isUploadingAlbum, setIsUploadingAlbum] = useState(false);

            const handleAddAlbum = async () => {
                if (!albumTitle || !albumCoverFile || !albumFiles || albumFiles.length === 0) {
                    return triggerToast("Please provide an album title, cover image, and at least 1 photo for the collage.");
                }
                setIsUploadingAlbum(true);
                try {
                    const coverRef = storageRef(storage, `albums/${Date.now()}_cover_${albumCoverFile.name}`);
                    await uploadBytesResumable(coverRef, albumCoverFile);
                    const coverUrl = await getDownloadURL(coverRef);

                    const photoUrls = [];
                    for (let i = 0; i < albumFiles.length; i++) {
                        const pRef = storageRef(storage, `albums/${Date.now()}_photo_${i}_${albumFiles[i].name}`);
                        await uploadBytesResumable(pRef, albumFiles[i]);
                        const pUrl = await getDownloadURL(pRef);
                        photoUrls.push(pUrl);
                    }

                    handleSaveAlbums([{ id: Date.now().toString(), title: albumTitle, cover: coverUrl, photos: photoUrls }, ...albums]);
                    
                    setAlbumTitle('');
                    setAlbumCoverFile(null);
                    setAlbumFiles(null);
                    document.getElementById('album-cover-input').value = '';
                    document.getElementById('album-photos-input').value = '';
                    triggerToast("📸 Album Collage created successfully!");
                } catch (err) {
                    triggerToast("Failed to create album");
                    console.error(err);
                }
                setIsUploadingAlbum(false);
            };

            const filteredCatalog = useMemo(() => {
                if (selectedCategory === "All") return catalog;
                return catalog.filter(item => item.category === selectedCategory);
            }, [catalog, selectedCategory]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
                    
                    {/* WATERMARK: MADE BY PRINCE */}
                    <div className="fixed bottom-3 right-3 sm:bottom-5 sm:right-5 z-[100] pointer-events-none">
                        <div className="bg-slate-900/80 backdrop-blur-md border border-cyan-500/30 text-cyan-400 text-[9px] sm:text-[10px] font-black uppercase tracking-[0.2em] px-3 py-1.5 sm:px-4 sm:py-2 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.25)] flex items-center gap-2">
                            <span className="text-white text-xs">⚡</span> Made by Prince
                        </div>
                    </div>

                    {/* Floating Nav Bar */}
                    {view === 'portfolio' && (
                        <nav className="fixed top-0 w-full z-40 bg-[#0f172a]/80 backdrop-blur-xl border-b border-cyan-500/10">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                    <img src="image_343465.jpg" alt="NTCE Logo" className="h-10 w-10 sm:h-12 sm:w-12 bg-white rounded-full p-0.5 object-contain border border-cyan-400/30 shadow-md" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
                                    <span className="text-xl animate-spin text-cyan-400 hidden" style={{ animationDuration: '12s' }}>⚡</span>
                                    <div className="text-xs sm:text-sm uppercase font-extrabold tracking-[0.25em] text-cyan-400 font-serif-luxury hidden sm:block">
                                        N.T.C.E
                                    </div>
                                </div>
                                <div className="flex gap-4 sm:gap-6 lg:gap-8 items-center text-[10px] sm:text-xs md:text-sm font-bold uppercase tracking-wider text-slate-300">
                                    <a href="#home" className="hover:text-cyan-400 transition-colors">Home</a>
                                    <a href="#courses" className="hover:text-cyan-400 transition-colors">Courses</a>
                                    <a href="#notes" className="hover:text-cyan-400 transition-colors hidden sm:block">Materials</a>
                                    <a href="#gallery" className="hover:text-cyan-400 transition-colors">Gallery</a>
                                    <button onClick={() => setView('login')} className="ml-2 text-cyan-500 hover:text-cyan-300 opacity-50 hover:opacity-100 transition-all">
                                        <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </nav>
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[110] w-11/12 max-w-md bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black py-4 px-6 rounded-3xl shadow-2xl flex items-center justify-between">
                            <span className="text-sm tracking-wide">{toastMessage}</span>
                            <button onClick={() => setToastMessage(null)} className="ml-3 text-lg font-black">&times;</button>
                        </div>
                    )}

                    {/* MAIN PORTFOLIO VIEW */}
                    {view === 'portfolio' && (
                        <div className="flex-grow pt-24 pb-12">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-20">
                                
                                <section id="home">
                                    <div className="text-center mb-12 relative">
                                        <div className="flex justify-center mb-6">
                                            <img src="image_343465.jpg" alt="NTCE Computer Education" className="w-32 h-32 md:w-44 md:h-44 object-contain bg-white rounded-full shadow-[0_0_40px_rgba(34,211,238,0.25)] border-4 border-slate-900" onError={(e) => e.target.style.display='none'} />
                                        </div>

                                        <span className="inline-block bg-sky-950/80 text-cyan-300 font-extrabold text-[11px] uppercase tracking-[0.3em] px-5 py-2 rounded-full border border-cyan-500/30 mb-6 pulse-cyan">
                                            Surat's Premier IT Institute
                                        </span>
                                        <h1 className="text-5xl sm:text-6xl md:text-7xl font-black leading-[0.95] tracking-tighter uppercase drop-shadow-lg mb-6">
                                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-sky-300">N.T.C.E</span><br/>
                                            <span className="text-white text-4xl sm:text-5xl md:text-6xl">COMPUTER</span><br/>
                                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 text-5xl sm:text-6xl md:text-7xl">EDUCATION</span>
                                        </h1>
                                        <p className="text-slate-300/80 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed font-light uppercase tracking-widest">
                                            Empowering future Software Developers, System Accountants, and Graphic Designers with ISO Certified Training.
                                        </p>
                                    </div>

                                    <div className="relative w-full overflow-hidden bg-gradient-to-r from-slate-950/40 via-sky-950/20 to-slate-950/40 border-y border-cyan-400/20 py-4 mb-10 rounded-2xl max-w-4xl mx-auto">
                                        <div className="animate-marquee whitespace-nowrap text-cyan-300 font-medium text-xs sm:text-sm tracking-widest flex items-center">
                                            <span className="mx-6">{links.alertMessage}</span>
                                            <span className="mx-6">•</span>
                                            <span className="mx-6">💻 Free Demonstration Lectures & Interactive Computer Labs</span>
                                            <span className="mx-6">•</span>
                                            <span className="mx-6">{links.alertMessage}</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                        <a href={links.best_seller} target="_blank" className="col-span-2 md:col-span-2 lg:col-span-2 bento-card p-6 rounded-[36px] flex flex-col items-start justify-between border-2 border-cyan-400/20 bg-gradient-to-br from-slate-900/60 to-sky-950/40 relative overflow-hidden group">
                                            <div className="absolute top-0 right-0 p-3 bg-cyan-400 text-slate-950 text-[10px] font-black uppercase tracking-widest rounded-bl-2xl">Featured</div>
                                            <div className="text-6xl mb-4 transform group-hover:scale-110 transition-transform origin-left">⚡</div>
                                            <div>
                                                <h3 className="text-xl md:text-2xl font-black text-cyan-300 uppercase tracking-tight">Full-Stack Batch</h3>
                                                <p className="text-white/60 text-xs uppercase tracking-wide mt-1 mb-4">Most Popular IT specialization of 2026</p>
                                                <span className="px-5 py-2.5 bg-cyan-400 text-slate-950 text-xs font-black rounded-full uppercase tracking-widest inline-block shadow-lg">Enroll Now</span>

                                                </div>

                                                        </div>
                                                    </div>
                                                    <button onClick={() => { handleSaveNotes(notes.filter(n => n.id !== item.id)); triggerToast("Material deleted."); }} className="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl transition-all" title="Delete"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: ALBUMS GALLERY MANAGER */}
                            {adminTab === 'albums' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900/50 p-6 rounded-[32px] border border-cyan-500/20 h-fit">
                                        <h3 className="text-sm font-black uppercase tracking-wider text-cyan-400 mb-6">Create New Photo Album</h3>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[9px] uppercase font-bold text-white/50 block mb-1">Album Title</label>
                                                <input type="text" placeholder="e.g. Coding Lab Sessions" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400" value={albumTitle} onChange={(e) => setAlbumTitle(e.target.value)} />
                                            </div>
                                            
                                            <div>
                                                <label className="text-[9px] uppercase font-bold text-cyan-300 block mb-1">Upload Album Cover (1 Image)</label>
                                                <input type="file" id="album-cover-input" accept="image/*" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-emerald-500/10 file:text-emerald-400 hover:file:bg-emerald-500/20 transition-all cursor-pointer" onChange={(e) => setAlbumCoverFile(e.target.files[0])} />
                                            </div>

                                            <div>
                                                <label className="text-[9px] uppercase font-bold text-cyan-300 block mb-1">Select Collage Photos (Multiple Allowed)</label>
                                                <input type="file" id="album-photos-input" multiple accept="image/*" className="w-full bg-slate-950 text-white rounded-xl p-3 text-xs border border-white/10 outline-none focus:border-cyan-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 transition-all cursor-pointer" onChange={(e) => setAlbumFiles(e.target.files)} />
                                            </div>

                                            <button onClick={handleAddAlbum} disabled={isUploadingAlbum} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all shadow-lg disabled:opacity-50">
                                                {isUploadingAlbum ? 'Uploading Images...' : 'Create Album Collage'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-black uppercase tracking-wider text-cyan-300 px-2">Live Albums ({albums.length})</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[600px] overflow-y-auto pr-2 scrollbar-none">
                                            {albums.map(item => (
                                                <div key={item.id} className="relative aspect-video rounded-2xl overflow-hidden group border border-white/10">
                                                    <img src={item.cover} alt={item.title} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" />
                                                    <button onClick={() => { handleSaveAlbums(albums.filter(g => g.id !== item.id)); triggerToast("Album removed."); }} className="absolute top-2 right-2 bg-rose-500/80 hover:bg-rose-600 text-white p-2 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity shadow-lg"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                                    <div className="absolute bottom-0 w-full bg-gradient-to-t from-slate-950 to-transparent p-3 pt-6 flex justify-between items-end">
                                                        <p className="text-xs font-black text-cyan-300 truncate">{item.title}</p>
                                                        <span className="text-[9px] bg-white/20 px-2 py-0.5 rounded-md font-bold">{item.photos.length} Photos</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: SETTINGS & LINKS */}
                            {adminTab === 'links' && (
                                <div className="max-w-2xl">
                                    <div className="bg-white/5 p-6 rounded-[32px] border border-white/10 space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-cyan-300 block mb-2">Announcement Banner Text</label>
                                            <textarea rows="2" className="w-full bg-[#020617] text-white rounded-xl px-4 py-3 text-xs outline-none border border-white/10 focus:border-cyan-400" value={links.alertMessage || ''} onChange={(e) => setLinks({...links, alertMessage: e.target.value})}></textarea>
                                        </div>
                                        {Object.keys(links).filter(k => k !== 'alertMessage').map(key => (
                                            <div key={key}>
                                                <label className="text-[10px] font-black uppercase text-white/60 block mb-1">{key.replace('_', ' ')}</label>
                                                <input className="w-full bg-[#020617] text-white rounded-lg px-4 py-3 text-xs outline-none border border-white/10 focus:border-cyan-400 disabled:opacity-50" value={links[key] || ''} disabled={key === 'google_rate'} onChange={(e) => setLinks({...links, [key]: e.target.value})} />
                                            </div>
                                        ))}
                                        <button onClick={handleSaveSettings} disabled={isSaving} className="w-full bg-cyan-500 text-slate-950 font-black py-4 rounded-xl hover:bg-cyan-400 transition-all text-xs uppercase tracking-widest mt-6">
                                            {isSaving ? "Saving..." : "Save Settings"}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* TAB: TESTIMONIALS */}
                            {adminTab === 'testimonials' && (
                                <div className="max-w-2xl space-y-4">
                                    <h3 className="text-xs font-black uppercase tracking-wider text-cyan-300">Manage Reviews</h3>
                                    {testimonials.map(item => (
                                        <div key={item.id} className="p-5 bg-white/5 rounded-2xl border border-white/10 flex items-start justify-between gap-4">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-sm font-bold text-cyan-200">{item.name}</span>
                                                    <span className="text-[10px] text-cyan-400 font-medium">({item.rating} ★)</span>
                                                </div>
                                                <p className="text-xs text-white/70 italic">"{item.comment}"</p>
                                            </div>
                                            <button onClick={() => { handleSaveTestimonials(testimonials.filter(t => t.id !== item.id)); triggerToast("Review removed."); }} className="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 px-3 py-1.5 rounded-lg font-bold transition-colors">Delete</button>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>
                    )}

                    {/* ==================================== */}
                    {/* CUSTOM FOOTER */}
                    {/* ==================================== */}
                    <footer className="mt-20 text-center space-y-8 pb-12 border-t border-cyan-500/10 pt-12 bg-slate-950 relative z-10">
                        <div className="flex justify-center gap-4 sm:gap-8 text-sm flex-wrap px-4">
                            <a href={links.instagram} target="_blank" className="text-white/40 hover:text-cyan-400 transition-all font-bold uppercase tracking-wider text-[10px]">Instagram</a>
                            <a href={links.telegram} target="_blank" className="text-white/40 hover:text-sky-400 transition-all font-bold uppercase tracking-wider text-[10px]">Telegram</a>
                            <a href={links.facebook} target="_blank" className="text-white/40 hover:text-blue-500 transition-all font-bold uppercase tracking-wider text-[10px]">Facebook</a>
                            <a href={links.google_rate} target="_blank" className="text-white/40 hover:text-cyan-300 transition-all font-bold uppercase tracking-wider text-[10px]">Google Reviews</a>
                            <a href={links.whatsapp} target="_blank" className="text-white/40 hover:text-emerald-400 transition-all font-bold uppercase tracking-wider text-[10px]">Contact Us</a>
                        </div>
                        <div className="space-y-2">
                            <p className="text-[10px] uppercase tracking-[0.4em] text-white/30 font-bold">© 2026 N.T.C.E COMPUTER EDUCATION</p>
                            <p className="text-[8px] uppercase tracking-[0.2em] text-cyan-500/30 font-semibold italic">Shaping Tomorrow's Digital Champions with ISO Certified Excellence</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
